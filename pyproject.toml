[project]
name = "al-hilal"
version = "0.1.0"
description = "Al Hilal (الهلال) — Islamic Calendar & Crescent Moon Prediction Engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Al Hilal Project" }]
keywords = ["islamic", "hijri", "crescent", "moon", "astronomy", "calendar"]

dependencies = [
    "skyfield>=1.49",
    "numpy>=1.26",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "tzdata>=2024.1",
    "timezonefinder>=6.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "types-python-dateutil>=2.9",
]
viz = [
    "matplotlib>=3.9",
    "cartopy>=0.23",
]

[project.scripts]
al-hilal = "al_hilal.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, no network, no ephemeris download",
    "integration: requires network + ephemeris; slow",
    "regression: accuracy floor; fails CI if score drops",
]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
