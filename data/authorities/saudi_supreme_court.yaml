description: >
  Official crescent sighting announcements for Ramadan, Shawwal (Eid al-Fitr),
  and Dhul Hijjah (Hajj/Eid al-Adha). While formally a sighting-based body, the Court
  frequently accepts witness reports when the Moon sets after sunset (lag > 0),
  even if optical visibility models deem it marginal or difficult.
